<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
<form class="form-card" th:object="${productDTO}" method="post" enctype="multipart/form-data" accept-charset="UTF-8"
      th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}">
    <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1>
    <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
        <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
    </div>
    <label for="name">Tên sản phẩm</label>
    <input id="name" type="text" th:field="*{name}"><small class="error-text" th:errors="*{name}"></small>
    <label for="description">Mô tả</label>
    <textarea id="description" th:field="*{description}" rows="5"></textarea>
    <label for="price">Giá</label>
    <input id="price" type="number" step="0.01" th:field="*{price}"><small class="error-text" th:errors="*{price}"></small>
    <label for="image">Ảnh</label>
    <input id="image" type="file" name="image" accept="image/*">
    <div th:if="${productDTO.imageUrl != null}">
        <img th:src="${productDTO.imageUrl}" class="preview" alt="">
    </div>
    <button type="submit" class="button">Lưu</button>
    <a class="button secondary" th:href="@{/products}">Hủy</a>
</form>
</main>
</div>
</body>
</html>
