<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-header">
        <h1>UTEShop</h1>
        <p>Hệ thống Đăng nhập Custom bằng Username hoặc Email</p>
    </div>

    <!-- Thông báo lỗi -->
    <div th:if="${param.error}" class="alert alert-error">
        ⚠️ Username/email hoặc mật khẩu không chính xác!
    </div>

    <!-- Thông báo đăng xuất thành công -->
    <div th:if="${param.logout}" class="alert alert-success">
        ✅ Bạn đã đăng xuất khỏi hệ thống thành công.
    </div>

    <!-- Form đăng nhập -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Tài khoản (Username hoặc Email)</label>
            <input type="text" id="username" name="username"
                   placeholder="Nhập user01 hoặc user01@gmail.com..." required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password"
                   placeholder="Nhập mật khẩu..." required>
        </div>

        <button type="submit" class="btn-primary">Đăng nhập</button>
    </form>

    <!-- Hộp gợi ý tài khoản mẫu để test -->
    <div class="demo-box">
        <strong>Tài khoản thử nghiệm sẵn có:</strong>
        <div class="demo-account">
            <span>👤 <b>User:</b> <code>user01</code> hoặc <code>user01@gmail.com</code></span>
            <span>🔑 <code>123456</code></span>
        </div>
        <div class="demo-account">
            <span>👑 <b>Admin:</b> <code>admin</code> hoặc <code>admin@iotstar.vn</code></span>
            <span>🔑 <code>123456</code></span>
        </div>
    </div>
</div>

</body>
</html>
